<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#1c1e20',
                        fg: '#e6e3de',
                        muted: '#9b968e',
                        surface: '#242629',
                        border: '#27292b',
                        point: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #1c1e20; color: #e6e3de; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1c1e20; }
        ::-webkit-scrollbar-thumb { background: #27292b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 8px; font-size: 14px; animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
        .toast-success { background: #166534; color: #bbf7d0; border: 1px solid #22c55e; }
        .toast-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .drop-zone { border: 2px dashed #27292b; transition: border-color 0.2s, background-color 0.2s; }
        .drop-zone.dragover { border-color: #3b82f6; background-color: rgba(59,130,246,0.1); }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
        .btn-primary { background: #3b82f6; color: white; transition: background 0.2s; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn-secondary { background: #242629; color: #e6e3de; border: 1px solid #27292b; transition: background 0.2s, border-color 0.2s; }
        .btn-secondary:hover { background: #27292b; border-color: #3b82f6; }
        .card { background: #242629; border: 1px solid #27292b; border-radius: 12px; transition: border-color 0.2s; }
        .card:hover { border-color: #3b82f6; }
        .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9998; display: flex; align-items: center; justify-content: center; }
        .confirm-dialog { background: #242629; border: 1px solid #27292b; border-radius: 12px; padding: 24px; max-width: 400px; width: 90%; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body class="min-h-screen">

<div id="toast-container" class="toast-container"></div>

<div id="confirm-dialog" class="confirm-overlay" style="display:none;">
    <div class="confirm-dialog">
        <p id="confirm-message" class="text-fg text-sm mb-4"></p>
        <div class="flex gap-2 justify-end">
            <button id="confirm-cancel" class="btn-secondary px-4 py-2 rounded-lg text-sm">취소</button>
            <button id="confirm-ok" class="px-4 py-2 rounded-lg text-sm" style="background:#ef4444;color:white;">삭제</button>
        </div>
    </div>
</div>

<div id="screen-setup" class="form-section">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-semibold text-fg">TOTP 설정</h1>
                <p class="text-muted text-sm mt-2">관리자 인증을 위한 TOTP를 설정합니다.</p>
            </div>
            <div class="card p-6">
                <button id="btn-generate-secret" class="btn-primary w-full py-3 rounded-lg text-sm font-medium mb-4">새 시크릿 생성</button>
                <div id="totp-setup-content" style="display:none;">
                    <div class="text-center mb-4">
                        <img id="qr-code" src="" alt="QR Code" class="mx-auto rounded-lg mb-3" style="max-width:200px;">
                        <div class="bg-bg rounded-lg p-3 mb-2">
                            <p id="secret-text" class="text-fg text-sm font-mono break-all select-all"></p>
                        </div>
                        <p class="text-muted text-xs">위 시크릿을 복사하여 Vercel 대시보드의 TOTP_SECRET 환경변수로 설정하세요.</p>
                    </div>
                </div>
                <div class="border-t border-border mt-4 pt-4">
                    <p class="text-muted text-xs mb-2">시크릿을 환경변수로 설정한 후 로그인 화면에서 인증하세요.</p>
                    <button id="btn-go-login" class="btn-secondary w-full py-2 rounded-lg text-sm">로그인 화면으로 이동</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="screen-login" class="form-section">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-semibold text-fg">로그인</h1>
                <p class="text-muted text-sm mt-2">TOTP 인증 코드를 입력하세요.</p>
            </div>
            <div class="card p-6">
                <div class="mb-4">
                    <label class="block text-muted text-xs mb-2">인증 코드</label>
                    <input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" class="w-full bg-bg border border-border rounded-lg px-4 py-3 text-fg text-center text-lg tracking-[0.5em] font-mono">
                </div>
                <p id="login-error" class="text-red-400 text-xs mb-3" style="display:none;"></p>
                <button id="btn-login" class="btn-primary w-full py-3 rounded-lg text-sm font-medium">로그인</button>
                <div class="mt-4 text-center">
                    <button id="btn-go-setup" class="text-muted text-xs hover:text-fg transition-colors">TOTP 설정 화면으로 이동</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="screen-dashboard" class="form-section">
    <div class="min-h-screen">
        <header class="border-b border-border bg-surface/80 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                <h1 class="text-lg font-semibold text-fg">프로젝트 관리</h1>
                <div class="flex items-center gap-3">
                    <a href="/" class="text-muted text-xs hover:text-fg transition-colors hidden sm:block">监听页面 열기 →</a>
                    <button id="btn-logout" class="text-muted text-xs hover:text-fg transition-colors">로그아웃</button>
                </div>
            </div>
        </header>

        <div class="max-w-5xl mx-auto px-4 py-6">
            <div class="flex gap-1 mb-6 bg-surface rounded-lg p-1 w-fit">
                <button id="tab-highlighted" class="tab-btn px-4 py-2 rounded-md text-sm font-medium transition-colors" style="background:#3b82f6;color:white;">대표 프로젝트</button>
                <button id="tab-more" class="tab-btn px-4 py-2 rounded-md text-sm font-medium transition-colors text-muted hover:text-fg">추가 프로젝트</button>
            </div>

            <div id="panel-highlighted" class="form-section active">
                <div id="highlighted-list" class="space-y-3 mb-4"></div>
                <button id="btn-add-highlighted" class="btn-secondary w-full py-3 rounded-lg text-sm font-medium border-dashed">+ 새 프로젝트 추가</button>
            </div>

            <div id="panel-more" class="form-section">
                <div id="more-list" class="space-y-3 mb-4"></div>
                <button id="btn-add-more" class="btn-secondary w-full py-3 rounded-lg text-sm font-medium border-dashed">+ 새 프로젝트 추가</button>
            </div>

            <div class="fixed bottom-0 left-0 right-0 p-4 bg-bg/90 backdrop-blur-md border-t border-border z-40">
                <div class="max-w-5xl mx-auto flex justify-end">
                    <button id="btn-save" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-medium" disabled>💾 저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const BASE = location.origin;
    let state = { highlighted: [], more: [] };
    let originalState = null;
    let currentTab = 'highlighted';
    let editingId = null;
    let dirty = false;

    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    function showScreen(id) {
        $$('.form-section').forEach(el => el.classList.remove('active'));
        const el = $(id);
        if (el) el.classList.add('active');
    }

    function toast(msg, type) {
        const c = $('#toast-container');
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function confirm(msg) {
        return new Promise(resolve => {
            $('#confirm-message').textContent = msg;
            $('#confirm-dialog').style.display = 'flex';
            const ok = () => { cleanup(); resolve(true); };
            const cancel = () => { cleanup(); resolve(false); };
            const cleanup = () => {
                $('#confirm-dialog').style.display = 'none';
                $('#confirm-ok').removeEventListener('click', ok);
                $('#confirm-cancel').removeEventListener('click', cancel);
            };
            $('#confirm-ok').addEventListener('click', ok);
            $('#confirm-cancel').addEventListener('click', cancel);
        });
    }

    function titleToId(title) {
        return title.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-|-$/g, '') || 'untitled';
    }

    function setDirty(v) {
        dirty = v;
        $('#btn-save').disabled = !v;
    }

    function makeApi(path, opts) {
        return fetch(BASE + path, opts).then(async r => {
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'API error');
            return d;
        });
    }

    function getHighlightedTemplate() {
        return { id: '', title: '', description: '', tags: [], image: '', link: '', placeholder: false };
    }

    function getMoreTemplate() {
        return { id: '', title: '', description: '', tech: '', link: '' };
    }

    function renderHighlighted() {
        const list = $('#highlighted-list');
        list.innerHTML = '';
        state.highlighted.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'card overflow-hidden';
            card.dataset.id = p.id;

            const preview = p.image
                ? `<img src="${p.image}" class="w-16 h-12 object-cover rounded-md flex-shrink-0">`
                : `<div class="w-16 h-12 rounded-md flex-shrink-0 flex items-center justify-center text-muted text-xs" style="background:#1c1e20;">없음</div>`;

            const isEditing = editingId === 'h-' + i;

            card.innerHTML = `
                <div class="p-4 flex items-center gap-4 cursor-pointer hover:bg-bg/50 transition-colors" data-action="toggle" data-index="${i}">
                    ${preview}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-muted text-xs">${i + 1}</span>
                            <h3 class="text-fg text-sm font-medium truncate">${p.title || '제목 없음'}</h3>
                            ${p.placeholder ? '<span class="text-xs px-2 py-0.5 rounded-full" style="background:#3b82f620;color:#3b82f6;">Coming Soon</span>' : ''}
                        </div>
                        <p class="text-muted text-xs truncate mt-0.5">${p.description || '설명 없음'}</p>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0" onclick="event.stopPropagation()">
                        <button data-action="edit" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-fg hover:bg-bg transition-colors" title="편집">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button data-action="delete" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-red-400 hover:bg-bg transition-colors" title="삭제">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        <button data-action="up" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-fg hover:bg-bg transition-colors" title="위로" ${i === 0 ? 'disabled style="opacity:0.3"' : ''}>
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                        </button>
                        <button data-action="down" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-fg hover:bg-bg transition-colors" title="아래로" ${i === state.highlighted.length - 1 ? 'disabled style="opacity:0.3"' : ''}>
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                    </div>
                </div>
                ${isEditing ? `<div class="border-t border-border p-4" id="edit-form-h-${i}"></div>` : ''}
            `;
            list.appendChild(card);

            if (isEditing) {
                renderHighlightedForm(i, $(`#edit-form-h-${i}`));
            }
        });
    }

    function renderHighlightedForm(i, container) {
        const p = state.highlighted[i];
        container.innerHTML = `
            <div class="space-y-4">
                <div>
                    <label class="block text-muted text-xs mb-1">제목</label>
                    <input type="text" data-field="title" value="${esc(p.title)}" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm">
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">설명</label>
                    <textarea data-field="description" rows="3" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm resize-none">${esc(p.description)}</textarea>
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">태그 (쉼표 구분)</label>
                    <input type="text" data-field="tags" value="${esc((p.tags||[]).join(', '))}" placeholder="Node.js, Discord.js, Supabase" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm">
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">이미지</label>
                    <div class="flex items-start gap-3">
                        <div class="flex-1">
                            <div class="drop-zone rounded-lg p-4 text-center cursor-pointer mb-2" data-upload-area="${i}">
                                <svg class="w-6 h-6 mx-auto text-muted mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                <p class="text-muted text-xs">클릭 또는 드래그하여 업로드</p>
                                <p class="text-muted text-xs mt-1">PNG, JPG, GIF, WebP (최대 5MB)</p>
                                <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden" data-file-input="${i}">
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="text" data-field="image" value="${esc(p.image)}" placeholder="이미지 URL" class="flex-1 bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm">
                            </div>
                        </div>
                        <div id="img-preview-${i}" class="w-24 h-24 rounded-lg overflow-hidden flex-shrink-0 bg-bg flex items-center justify-center">
                            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : '<span class="text-muted text-xs">미리보기</span>'}
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">링크 URL</label>
                    <input type="text" data-field="link" value="${esc(p.link)}" placeholder="https://..." class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm" id="link-input-h-${i}">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" data-field="placeholder" id="placeholder-h-${i}" ${p.placeholder ? 'checked' : ''} class="accent-blue-500">
                    <label for="placeholder-h-${i}" class="text-muted text-xs">Coming Soon (이미지/링크 필드 숨김)</label>
                </div>
                <div class="flex gap-2 justify-end pt-2 border-t border-border">
                    <button data-action="cancel-edit" class="btn-secondary px-4 py-2 rounded-lg text-sm">취소</button>
                    <button data-action="save-edit" class="btn-primary px-4 py-2 rounded-lg text-sm">적용</button>
                </div>
            </div>
        `;

        const placeholder = container.querySelector('[data-field="placeholder"]');
        const linkInput = container.querySelector(`#link-input-h-${i}`);
        const dropZone = container.querySelector(`[data-upload-area="${i}"]`);
        const fileInput = container.querySelector(`[data-file-input="${i}"]`);
        const imgPreview = container.querySelector(`#img-preview-${i}`);

        const updateLinkVisibility = () => {
            const isPlaceholder = placeholder.checked;
            const imgField = container.querySelector('[data-field="image"]').closest('.space-y-4 > div');
            const linkField = linkInput.closest('.space-y-4 > div');
            if (isPlaceholder) {
                imgField.style.display = 'none';
                linkField.style.display = 'none';
            } else {
                imgField.style.display = '';
                linkField.style.display = '';
            }
        };
        placeholder.addEventListener('change', updateLinkVisibility);
        updateLinkVisibility();

        if (dropZone && fileInput) {
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleFileUpload(e.dataTransfer.files[0], i, container, imgPreview);
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) handleFileUpload(fileInput.files[0], i, container, imgPreview);
            });
        }
    }

    function handleFileUpload(file, index, container, previewEl) {
        if (file.size > 5 * 1024 * 1024) {
            toast('파일 크기는 5MB 이하여야 합니다.', 'error');
            return;
        }
        const token = sessionStorage.getItem('admin_token');
        if (!token) { toast('인증이 필요합니다.', 'error'); return; }

        const formData = new FormData();
        formData.append('file', file);

        const dropZone = container.querySelector(`[data-upload-area="${index}"]`);
        if (dropZone) dropZone.innerHTML = '<p class="text-muted text-xs">업로드 중...</p>';

        fetch(BASE + '/api/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: formData
        }).then(async r => {
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Upload failed');
            return d;
        }).then(d => {
            const urlInput = container.querySelector('[data-field="image"]');
            if (urlInput) urlInput.value = d.url;
            if (previewEl) previewEl.innerHTML = `<img src="${d.url}" class="w-full h-full object-cover">`;
            if (dropZone) {
                dropZone.innerHTML = `
                    <svg class="w-6 h-6 mx-auto text-muted mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <p class="text-muted text-xs">클릭 또는 드래그하여 업로드</p>
                    <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden" data-file-input="${index}">
                `;
                const newFileInput = dropZone.querySelector(`[data-file-input="${index}"]`);
                if (newFileInput) {
                    newFileInput.addEventListener('change', () => {
                        if (newFileInput.files.length) handleFileUpload(newFileInput.files[0], index, container, previewEl);
                    });
                }
                dropZone.addEventListener('click', () => {
                    const fi = dropZone.querySelector(`[data-file-input="${index}"]`);
                    if (fi) fi.click();
                });
            }
            toast('이미지 업로드 완료', 'success');
        }).catch(err => {
            toast('업로드 실패: ' + err.message, 'error');
            if (dropZone) {
                dropZone.innerHTML = `
                    <svg class="w-6 h-6 mx-auto text-muted mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <p class="text-muted text-xs">클릭 또는 드래그하여 업로드</p>
                    <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden" data-file-input="${index}">
                `;
                const newFileInput = dropZone.querySelector(`[data-file-input="${index}"]`);
                if (newFileInput) {
                    newFileInput.addEventListener('change', () => {
                        if (newFileInput.files.length) handleFileUpload(newFileInput.files[0], index, container, previewEl);
                    });
                }
                dropZone.addEventListener('click', () => {
                    const fi = dropZone.querySelector(`[data-file-input="${index}"]`);
                    if (fi) fi.click();
                });
            }
        });
    }

    function renderMore() {
        const list = $('#more-list');
        list.innerHTML = '';
        state.more.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'card overflow-hidden';
            card.dataset.id = p.id;

            const isEditing = editingId === 'm-' + i;

            card.innerHTML = `
                <div class="p-4 flex items-center gap-4 cursor-pointer hover:bg-bg/50 transition-colors" data-action="toggle" data-index="${i}">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-muted text-xs">${i + 1}</span>
                            <h3 class="text-fg text-sm font-medium truncate">${p.title || '제목 없음'}</h3>
                        </div>
                        <p class="text-muted text-xs truncate mt-0.5">${p.description || '설명 없음'}</p>
                        ${p.tech ? `<p class="text-muted text-xs mt-1" style="color:#3b82f6;">${p.tech}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0" onclick="event.stopPropagation()">
                        <button data-action="edit" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-fg hover:bg-bg transition-colors" title="편집">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button data-action="delete" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-red-400 hover:bg-bg transition-colors" title="삭제">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        <button data-action="up" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-fg hover:bg-bg transition-colors" title="위로" ${i === 0 ? 'disabled style="opacity:0.3"' : ''}>
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                        </button>
                        <button data-action="down" data-index="${i}" class="p-1.5 rounded-md text-muted hover:text-fg hover:bg-bg transition-colors" title="아래로" ${i === state.more.length - 1 ? 'disabled style="opacity:0.3"' : ''}>
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                    </div>
                </div>
                ${isEditing ? `<div class="border-t border-border p-4" id="edit-form-m-${i}"></div>` : ''}
            `;
            list.appendChild(card);

            if (isEditing) {
                renderMoreForm(i, $(`#edit-form-m-${i}`));
            }
        });
    }

    function renderMoreForm(i, container) {
        const p = state.more[i];
        container.innerHTML = `
            <div class="space-y-4">
                <div>
                    <label class="block text-muted text-xs mb-1">제목</label>
                    <input type="text" data-field="title" value="${esc(p.title)}" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm">
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">설명</label>
                    <textarea data-field="description" rows="3" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm resize-none">${esc(p.description)}</textarea>
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">기술 스택</label>
                    <input type="text" data-field="tech" value="${esc(p.tech)}" placeholder="Python · ONNX" class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm">
                </div>
                <div>
                    <label class="block text-muted text-xs mb-1">링크 URL</label>
                    <input type="text" data-field="link" value="${esc(p.link)}" placeholder="https://..." class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-fg text-sm">
                </div>
                <div class="flex gap-2 justify-end pt-2 border-t border-border">
                    <button data-action="cancel-edit" class="btn-secondary px-4 py-2 rounded-lg text-sm">취소</button>
                    <button data-action="save-edit" class="btn-primary px-4 py-2 rounded-lg text-sm">적용</button>
                </div>
            </div>
        `;
    }

    function esc(s) {
        if (!s) return '';
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function applyFormValues(index, tab) {
        const isH = tab === 'highlighted';
        const container = isH ? $(`#edit-form-h-${index}`) : $(`#edit-form-m-${index}`);
        if (!container) return;
        const data = isH ? state.highlighted[index] : state.more[index];
        container.querySelectorAll('[data-field]').forEach(el => {
            const f = el.dataset.field;
            if (f === 'placeholder') {
                data[f] = el.checked;
            } else if (f === 'tags') {
                data[f] = el.value.split(',').map(s => s.trim()).filter(Boolean);
            } else {
                data[f] = el.value;
            }
        });
        if (isH) {
            data.id = data.id || titleToId(data.title);
        } else {
            data.id = data.id || titleToId(data.title);
        }
    }

    function render() {
        if (currentTab === 'highlighted') {
            renderHighlighted();
        } else {
            renderMore();
        }
    }

    $('#tab-highlighted').addEventListener('click', () => {
        currentTab = 'highlighted';
        editingId = null;
        $('#tab-highlighted').style.background = '#3b82f6';
        $('#tab-highlighted').style.color = 'white';
        $('#tab-more').style.background = '';
        $('#tab-more').style.color = '';
        $('#tab-more').classList.add('text-muted');
        $('#panel-highlighted').classList.add('active');
        $('#panel-more').classList.remove('active');
        render();
    });

    $('#tab-more').addEventListener('click', () => {
        currentTab = 'more';
        editingId = null;
        $('#tab-more').style.background = '#3b82f6';
        $('#tab-more').style.color = 'white';
        $('#tab-highlighted').style.background = '';
        $('#tab-highlighted').style.color = '';
        $('#tab-highlighted').classList.add('text-muted');
        $('#panel-more').classList.add('active');
        $('#panel-highlighted').classList.remove('active');
        render();
    });

    document.addEventListener('click', e => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const index = parseInt(btn.dataset.index);

        if (action === 'toggle') {
            if (editingId) return;
            editingId = (currentTab === 'highlighted' ? 'h-' : 'm-') + index;
            render();
        } else if (action === 'edit') {
            editingId = (currentTab === 'highlighted' ? 'h-' : 'm-') + index;
            render();
        } else if (action === 'delete') {
            const arr = currentTab === 'highlighted' ? state.highlighted : state.more;
            confirm(`"${arr[index].title || '이 프로젝트'}"를 삭제하시겠습니까?`).then(ok => {
                if (!ok) return;
                arr.splice(index, 1);
                if (editingId === (currentTab === 'highlighted' ? 'h-' : 'm-') + index) editingId = null;
                setDirty(true);
                render();
                toast('프로젝트가 삭제되었습니다.', 'success');
            });
        } else if (action === 'up') {
            const arr = currentTab === 'highlighted' ? state.highlighted : state.more;
            if (index > 0) {
                [arr[index - 1], arr[index]] = [arr[index], arr[index - 1]];
                if (editingId) {
                    const prefix = currentTab === 'highlighted' ? 'h-' : 'm-';
                    const editIndex = parseInt(editingId.replace(prefix, ''));
                    if (editIndex === index) editingId = prefix + (index - 1);
                    else if (editIndex === index - 1) editingId = prefix + index;
                }
                setDirty(true);
                render();
            }
        } else if (action === 'down') {
            const arr = currentTab === 'highlighted' ? state.highlighted : state.more;
            if (index < arr.length - 1) {
                [arr[index], arr[index + 1]] = [arr[index + 1], arr[index]];
                if (editingId) {
                    const prefix = currentTab === 'highlighted' ? 'h-' : 'm-';
                    const editIndex = parseInt(editingId.replace(prefix, ''));
                    if (editIndex === index) editingId = prefix + (index + 1);
                    else if (editIndex === index + 1) editingId = prefix + index;
                }
                setDirty(true);
                render();
            }
        } else if (action === 'cancel-edit') {
            editingId = null;
            render();
        } else if (action === 'save-edit') {
            applyFormValues(index, currentTab);
            editingId = null;
            setDirty(true);
            render();
            toast('변경사항이 적용되었습니다. 저장 버튼을 눌러주세요.', 'success');
        }
    });

    $('#btn-add-highlighted').addEventListener('click', () => {
        const p = getHighlightedTemplate();
        p.id = titleToId('new-project-' + Date.now());
        state.highlighted.push(p);
        editingId = 'h-' + (state.highlighted.length - 1);
        setDirty(true);
        render();
        toast('새 프로젝트가 추가되었습니다.', 'success');
    });

    $('#btn-add-more').addEventListener('click', () => {
        const p = getMoreTemplate();
        p.id = titleToId('new-project-' + Date.now());
        state.more.push(p);
        editingId = 'm-' + (state.more.length - 1);
        setDirty(true);
        render();
        toast('새 프로젝트가 추가되었습니다.', 'success');
    });

    $('#btn-save').addEventListener('click', () => {
        const token = sessionStorage.getItem('admin_token');
        if (!token) { toast('인증이 필요합니다.', 'error'); return; }

        if (editingId) {
            const prefix = currentTab === 'highlighted' ? 'h-' : 'm-';
            const idx = parseInt(editingId.replace(prefix, ''));
            applyFormValues(idx, currentTab);
        }

        $('#btn-save').disabled = true;
        $('#btn-save').textContent = '저장 중...';

        makeApi('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(state)
        }).then(() => {
            originalState = JSON.parse(JSON.stringify(state));
            setDirty(false);
            toast('저장되었습니다.', 'success');
            if (editingId) { editingId = null; render(); }
        }).catch(err => {
            setDirty(true);
            toast('저장 실패: ' + err.message, 'error');
        }).finally(() => {
            $('#btn-save').textContent = '💾 저장';
        });
    });

    $('#btn-generate-secret').addEventListener('click', () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let secret = '';
        for (let i = 0; i < 32; i++) secret += chars[Math.floor(Math.random() * chars.length)];
        const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?data=otpauth://totp/Portfolio:admin?secret=' + secret + '&issuer=Portfolio&algorithm=SHA1&digits=6&period=30&size=200x200';
        $('#qr-code').src = qrUrl;
        $('#secret-text').textContent = secret;
        $('#totp-setup-content').style.display = 'block';
        $('#btn-generate-secret').style.display = 'none';
    });

    $('#btn-go-login').addEventListener('click', () => showScreen('#screen-login'));
    $('#btn-go-setup').addEventListener('click', () => showScreen('#screen-setup'));

    $('#btn-login').addEventListener('click', () => {
        const code = $('#login-code').value.trim();
        if (!code || code.length !== 6 || !/^\d{6}$/.test(code)) {
            $('#login-error').textContent = '6자리 숫자를 입력하세요.';
            $('#login-error').style.display = 'block';
            return;
        }
        $('#login-error').style.display = 'none';
        $('#btn-login').disabled = true;
        $('#btn-login').textContent = '로그인 중...';

        makeApi('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
        }).then(d => {
            sessionStorage.setItem('admin_token', d.token);
            loadProjects();
        }).catch(err => {
            $('#login-error').textContent = '인증 실패: ' + err.message;
            $('#login-error').style.display = 'block';
        }).finally(() => {
            $('#btn-login').disabled = false;
            $('#btn-login').textContent = '로그인';
        });
    });

    $('#login-code').addEventListener('keydown', e => {
        if (e.key === 'Enter') $('#btn-login').click();
    });

    $('#btn-logout').addEventListener('click', () => {
        sessionStorage.removeItem('admin_token');
        state = { highlighted: [], more: [] };
        originalState = null;
        editingId = null;
        setDirty(false);
        showScreen('#screen-login');
        toast('로그아웃되었습니다.', 'success');
    });

    function loadProjects() {
        const token = sessionStorage.getItem('admin_token');
        makeApi('/api/projects', {
            headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        }).then(d => {
            state.highlighted = d.highlighted || [];
            state.more = d.more || [];
            originalState = JSON.parse(JSON.stringify(state));
            showScreen('#screen-dashboard');
            render();
        }).catch(() => {
            showScreen('#screen-login');
        });
    }

    window.addEventListener('beforeunload', e => {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    const token = sessionStorage.getItem('admin_token');
    if (token) {
        loadProjects();
    } else {
        showScreen('#screen-login');
    }
})();
</script>
</body>
</html>
